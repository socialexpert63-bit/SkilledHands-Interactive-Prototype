 const o=OB[S.ob];P.innerHTML=`<div class="scr" style="display:flex;flex-direction:column;justify-content:center;text-align:center;padding-bottom:30px"><div class="ill"><i></i><i></i><b>${o[0]}</b><span style="top:2%;left:4%">🔧</span><span style="top:58%;right:-4%;animation-delay:1s">⭐</span><span style="bottom:0;left:10%;animation-delay:2s">✅</span></div><h1 style="margin-top:20px">${o[1]}</h1><p class="mute" style="margin:10px 12px 0;font-size:14px">${o[2]}</p><div class="dots">${OB.map((_,i)=>`<i class="${i==S.ob?'on':''}"></i>`).join('')}</div><button class="btn t w" onclick="S.ob=${S.ob<3?S.ob+1:9};onboard()">${S.ob<3?'Next':'Get Started'}</button><button class="btn g w" style="margin-top:8px" onclick="${S.ob<3?'S.ob=9;onboard()':'S.pr=\'guardian\';auth(\'login\')'}">${S.ob<3?'Skip':'I Already Have an Account'}</button></div>`;
 let x0;P.ontouchstart=e=>x0=e.touches[0].clientX;P.ontouchend=e=>{if(S.role||S.ob>3)return;const d=e.changedTouches[0].clientX-x0;if(d<-60&&S.ob<3){S.ob++;onboard()}if(d>60&&S.ob>0){S.ob--;onboard()}}}

function reqCard(r){const m=M.find(x=>x.id==r.m);return `<div class="card"><div class="row">${av(m.n)}<div style="flex:1"><h3>${m.n}</h3><small>${r.sk} · ${r.when} · ${r.dur} min</small></div></div><p class="mute" style="margin:10px 0">📍 ${r.fmt}</p><div class="row"><button class="btn t" style="flex:1" onclick="approve('${r.id}')">Approve</button><button class="btn g" style="flex:1" onclick="decline('${r.id}')">Decline</button></div></div>`}

function profile(id){const m=M.find(x=>x.id==id),ok=m.v=='verified';
 sheet(`<div class="row">${av(m.n,64)}<div><h1>${m.n}</h1><small>${m.t} · ${m.loc}</small><br><small>★ ${m.r||'–'} (${m.rv} demo reviews)</small></div></div><h2>About</h2><p class="mute">${m.bio}</p><h2>Trust & verification</h2><div class="card" style="animation:none">${[['Identity check',m.v],['Background check',m.v],['Profile approval',m.v=='none'?'none':m.v],['Safeguarding training',m.v=='verified'?'verified':'pending']].map(x=>`<div class="vr"><div style="flex:1">${x[0]}</div>${vt(x[1])}</div>`).join('')}<small>Demo statuses only. No real third-party check has occurred.</small></div><h2>Availability</h2>${m.slots.map(s=>`<span class="tag">${s}</span>`).join('')||'<small>None yet</small>'}<button class="btn t w" style="margin-top:16px" ${ok?'':'disabled'} onclick="book(${m.id})">${ok?'Request a Session':'Not bookable until verified'}</button>`)}

function sessions(){
 const w=S.reqs.map(r=>{const m=M.find(x=>x.id==r.m);return `<div class="card"><div class="row sp"><div><h3>${r.sk}</h3><small>${m.n} · ${r.when}</small></div>${r.st=='guardian'?'<span class="tag w">Awaiting guardian</span>':r.st=='approved'?'<span class="tag">Guardian approved</span>':'<span class="tag">Confirmed</span>'}</div></div>`}).join('');
 return `<h1>Sessions</h1><h2>Confirmed</h2>${S.sess.map(sessCard).join('')}<h2>Requests</h2>${w||'<div class="card mute">No requests</div>'}`}
function startSess(id){S.ci=0;S.sec=0;S.cur=S.sess.find(x=>x.id==id);const m=M.find(x=>x.id==S.cur.m);
 sheet(`<h2 style="margin-top:0">${S.cur.sk} with ${m.n}</h2><div class="card" style="animation:none"><p>📍 ${S.cur.fmt}</p><p>🕒 ${S.cur.when} · ${S.cur.dur} min</p><p>📞 Guardian: Sarah (visible)</p><p>✅ Approval: recorded</p></div><p class="sim">Simulated safety plan. Location sharing is OFF; it would require explicit consent. Messages stay guardian-visible.</p><button class="btn t w" onclick="active()">Start session</button>`)}
let tm;function active(){S.ci=1;S.log.unshift({t:now(),e:'Session started'});clearInterval(tm);tm=setInterval(()=>{S.sec++;const e=$('#tm');if(e)e.textContent=String(Math.floor(S.sec/60)).padStart(2,'0')+':'+String(S.sec%60).padStart(2,'0')},1000);act()}
function act(){const m=M.find(x=>x.id==S.cur.m);sheet(`<div class="row sp"><h2 style="margin:0"><span class="live"></span> Session live</h2><small>Guardian can view</small></div><div class="big" id="tm">00:00</div><p class="mute" style="text-align:center">${S.cur.sk} · ${m.n}</p><div class="row" style="margin:14px 0"><button class="btn ${S.ci>=2?'g':'t'}" style="flex:1" ${S.ci<1||S.ci>=2?'disabled':''} onclick="ck(2,'Mid-session check-in OK')">${S.ci>=2?'✓ ':''}Mid check-in</button><button class="btn" style="flex:1" ${S.ci<2?'disabled':''} onclick="fin()">Complete</button></div><button class="btn r w" onclick="emerg()">🆘 Emergency assistance</button><h3 style="margin-top:14px">Safety log</h3>${S.log.slice(0,4).map(l=>`<div class="vr"><small>${l.t}</small><div>${l.e}</div></div>`).join('')}`)}

function fin(){clearInterval(tm);S.log.unshift({t:now(),e:'Session completed, guardian notified'});sheet(`<div class="done">✓</div><h2 style="text-align:center">Session complete</h2><p class="mute" style="text-align:center">Check-out recorded. Sarah was notified. How was it?</p><div class="chips" style="justify-content:center;font-size:26px">★ ★ ★ ★ ★</div><button class="btn t w" onclick="close();toast('Feedback saved')">Submit feedback</button>`)}

function mentorHome(){const q=S.reqs;return hdr('Welcome, Daniel','Mentor · profile approved (demo)')+`<div class="row" style="flex-wrap:wrap">${[['Upcoming',S.sess.length],['Completed',112],['Pending',q.length],['Rating','4.9']].map(s=>`<div class="card" style="flex:1 1 40%;text-align:center"><div style="font-size:26px;font-weight:800">${s[1]}</div><small>${s[0]}</small></div>`).join('')}</div><h2>Session requests</h2>`+q.map(r=>{const m=M.find(x=>x.id==r.m);return `<div class="card"><h3>Alex M. · ${r.sk}</h3><small>${r.when} · ${r.dur} min</small><div style="margin:8px 0">${r.st=='guardian'?'<span class="tag w">Guardian approval pending</span>':'<span class="tag">Guardian approved</span>'}</div><div class="row"><button class="btn t" style="flex:1" ${r.st=='guardian'?'disabled':''} onclick="acc('${r.id}')">Accept</button><button class="btn g" style="flex:1" onclick="decline('${r.id}')">Decline</button></div></div>`}).join('')||'<div class="card mute">No pending requests</div>'}

function enter(){S.role=S.pr||'guardian';S.tab='home';render();toast('Welcome! Demo account ('+S.role+')')}
function auth(m){const bk0='<button class="btn g" style="padding:8px 14px;margin-bottom:12px" onclick="S.ob=9;onboard()">←</button>';
 if(m=='reg')P.innerHTML=`<div class="scr"><div class="hero"><div class="row sp"><button class="bk" onclick="S.ob=9;onboard()" aria-label="Back">←</button><small style="color:#cfe">Step 2 of 3</small></div><div style="height:6px;border-radius:9px;margin:14px 0 16px;background:#ffffff33"><i style="display:block;height:100%;width:66%;background:#fff;border-radius:9px;animation:wd 1s"></i></div><h1 style="font-size:26px">Create your account</h1><span class="glass" style="display:inline-block;margin-top:10px;padding:6px 12px;border-radius:99px">${({guardian:'👪 Parent or Guardian',youth:'🎒 Young Learner',mentor:'🧑‍🏫 Mentor'})[S.pr]}</span>${S.pr=='youth'?'<p style="font-size:12.5px;opacity:.85;margin-top:8px">A guardian must authorise this account.</p>':''}</div><div class="fld"><label class="lb" for="nm">Full name</label><div class="pw"><i>👤</i><input id="nm" type="text" placeholder="e.g. Sarah Morgan" autocomplete=name></div><span class="err" id="e1"></span></div><div class="fld"><label class="lb" for="em">Email address</label><div class="pw"><i>✉️</i><input id="em" type="email" placeholder="you@example.com" ></div><span class="err" id="e2"></span></div><div class="fld"><label class="lb" for="ph">Phone number</label><div class="pw"><i>📱</i><input id="ph" type="tel" placeholder="+00 555 0100" ></div></div><div class="fld"><label class="lb" for="pw">Password</label><div class="pw"><i>🔒</i><input id="pw" type="password" placeholder="At least 8 characters" oninput=pws(this.value)><button type=button onclick=tpw('pw') aria-label='Show or hide password'>👁</button></div><span class="err" id="e3"></span></div><div class="sm"><i></i><i></i><i></i></div><small id="sl" class="mute" style="display:block;margin:-8px 0 14px">Use 8+ characters, a number and a capital letter</small><div class="fld"><label class="lb" for="cp">Confirm password</label><div class="pw"><i>🔐</i><input id="cp" type="password" placeholder="Re-enter password" ><button type=button onclick=tpw('cp') aria-label='Show or hide password'>👁</button></div><span class="err" id="e5"></span></div><label class="row chk"><input type="checkbox" id="tc"><span>I agree to the <b>Terms</b> and <b>Privacy Policy</b></span></label><span class="err" id="e4" style="margin:-6px 2px 12px"></span><button class="btn t w" id="go" onclick="regGo()">Create account →</button><p class="mute" style="text-align:center;margin-top:16px">Already have an account? <a role="button" tabindex="0" style="color:var(--teal2);font-weight:700;cursor:pointer" onclick="auth('login')">Log in</a></p><p class="sim" style="margin-top:14px">🔒 Demo only: nothing you type is stored or sent.</p></div>`;
 if(m=='login')P.innerHTML=`<div class="scr">${bk0}<h1>Welcome back</h1><p class="mute" style="margin:6px 0 16px">Log in to continue</p><input id="lem" type="email" placeholder="Email address" value="demo@skilledhands.app"><div class="pw"><input id="pw" type="password" value="demo1234" aria-label="Password"><button onclick="tpw()" aria-label="Show or hide password">👁</button></div><div class="row sp" style="margin-bottom:16px"><label class="row mute"><input type="checkbox" checked style="width:auto;margin:0"> Remember me</label><a class="mute" role="button" tabindex="0" onclick="toast('Reset link sent (simulated)')">Forgot password?</a></div><button class="btn t w" id="go" onclick="loginGo()">Log in</button><div class="row" style="margin-top:14px"><button class="btn g" style="flex:1" onclick="toast('Google sign-in: placeholder')">Google</button><button class="btn g" style="flex:1" onclick="toast('Apple sign-in: placeholder')">Apple</button></div><p class="sim" style="margin-top:16px">Demo login. Real authentication service goes here.</p></div>`;
 if(m=='otp'){cd=30;P.innerHTML=`<div class="scr" style="text-align:center">${bk0}<div style="font-size:54px">📩</div><h1>Verify your account</h1><p class="mute">Enter the 6-digit code (demo: any digits)</p><div class="otp">${[0,1,2,3,4,5].map(i=>`<input maxlength="1" inputmode="numeric" aria-label="Digit ${i+1}" oninput="otpIn(this)">`).join('')}</div><button class="btn t w" onclick="otpGo()">Verify</button><p class="mute" style="margin-top:14px" id="rs">Resend code in 30s</p></div>`;clearInterval(ot);ot=setInterval(()=>{const r=$('#rs');if(!r)return clearInterval(ot);cd--;r.innerHTML=cd>0?'Resend code in '+cd+'s':'<button class="btn g" onclick="auth(\'otp\')">Resend code</button>';if(cd<=0)clearInterval(ot)},1000)}}
function regGo(){const v=i=>$('#'+i).value.trim(),e=(i,t)=>{$('#'+i).textContent=t;return t?1:0};let bad=0;
 bad|=e('e1',v('nm').length<2?'Enter your full name':'');bad|=e('e2',/^\S+@\S+\.\S+$/.test(v('em'))?'':'Enter a valid email');bad|=e('e3',v('pw').length<8?'Password needs 8+ characters':'');bad|=e('e5',v('pw')==v('cp')?'':'Passwords do not match');bad|=e('e4',$('#tc').checked?'':'Please accept the terms');
 if(bad)return;const b=$('#go');b.classList.add('ld');b.disabled=true;setTimeout(()=>auth('otp'),900)}
function loginGo(){const b=$('#go');b.classList.add('ld');b.disabled=true;setTimeout(enter,800)}
function otpIn(el){el.value=el.value.replace(/\D/g,'');if(el.value&&el.nextElementSibling)el.nextElementSibling.focus()}
function otpGo(){const d=[...document.querySelectorAll('.otp input')].map(i=>i.value).join('');if(d.length<6)return toast('Enter all 6 digits');clearInterval(ot);P.innerHTML=`<div class="scr" style="text-align:center;padding-top:120px"><div class="done">✓</div><h1>Verified!</h1><p class="mute">Email and phone confirmed (simulated)</p></div>`;setTimeout(enter,1400)}

function gx(){const d=[40,65,30,80,55,90,45],l='MTWTFSS';
return `<div class="qa">${[['🔍','Find mentor','explore'],['📅','Sessions','sessions'],['💬','Messages','chat'],['🛡️','Safety','safety']].map((q,i)=>`<button onclick="go('${q[2]}')" style="animation-delay:${i*.07}s"><span>${q[0]}</span>${q[1]}</button>`).join('')}</div><div class="card"><div class="row sp"><h3>Weekly learning</h3><span class="tag">+18% this week</span></div><div class="bars">${d.map((v,i)=>`<div><i style="--h:${v}%;animation-delay:${i*.08}s"></i><small>${l[i]}</small></div>`).join('')}</div></div>`}
function yx(){const c=['Woodworking','Photography','Cooking','Coding','Electronics','Gardening'],E={Gardening:'🌿'},cnt=k=>M.filter(m=>m.cat==k&&m.v=='verified').length;
return `<div class="card" style="background:linear-gradient(135deg,var(--navy),#0f6b7a);color:#fff"><div class="row sp"><div><small style="color:#cfe">Level 3 · Skill Builder</small><h3>340 / 500 XP</h3></div><div style="font-size:36px">🏅</div></div><div class="xp"><i></i></div></div><h2 style="margin-top:4px">Explore your interests</h2><div class="cats">${c.map((x,i)=>{const p=(CV[x]||'#2e7d5b,#8fd694').split(',');return `<div class="cat" role="button" tabindex="0" style="--a:${p[0]};--b:${p[1]};animation-delay:${i*.06}s" onclick="S.cat='${x}';go('explore')"><span>${EM[x]||E[x]}</span><b>${x}</b><small>${cnt(x)} mentors</small></div>`}).join('')}</div><h2>Achievements</h2><div class="chips">${[['🥇','First Session',1],['🧭','Creative Explorer',1],['🔨','Skill Builder',1],['🔥','Consistency',0],['🔓','New Skill',0]].map((b,i)=>`<div class="bdg2 ${b[2]?'':'lock'}" style="animation-delay:${i*.1}s"><span>${b[0]}</span>${b[1]}</div>`).join('')}</div>`}
S.ob=-1;onboard();
</script></body></html>
